# === Signal thresholds (M4b: disciplined floors restored; full set served) ===
# The ETL (etl/06b) serves the FULL candidate set above these floors; the
# strong/weak two-tier SELECTION happens at request time in the API (M5).
thresholds:
  # --- disciplined absolute floors (a signal must clear export OR import) ---
  MIN_EXPORT_USD: 100000        # CZ export to the market for this HS6
  MIN_IMPORT_USD: 5000000       # market's total import of this HS6
  # --- peer-gap relative-gap tiers: (median - CZ_share)/median ---
  S1_REL_GAP_MIN: 0.20          # STRONG peer-gap tier (band=strong)
  S1_REL_GAP_WEAK: 0.10         # candidate floor — weak band lower bound (band=weak: 0.10–0.20)
  # --- YoY tiers (strong only; no weak band) ---
  S2_YOY_THRESHOLD: 0.30        # YoY export change
  S3_YOY_SHARE_THRESHOLD: 0.20  # YoY partner-share change
  # Caps moved to request time (API/M5). null = serve the full candidate set.
  MAX_TOTAL: null
  MAX_PER_TYPE: null

# === Labels used by API /controls and UI tooltips ===
metric_labels:
  YoY_export_change: "Exports YoY"
  YoY_partner_share_change: "Partner share YoY"
  delta_vs_peer: "Gap vs peer median"
  partner_share_in_cz_exports: "Partner share in CZ exports"
  median_peer_share: "Peer median share"
  podil_cz_na_importu: "CZ share of partner imports"
  YoY_partner_share_change_short: "Partner share"
  YoY_export_change_short: "Exports"
  Peer_gap_human: "Gap vs human peer group"
  Peer_gap_opportunity: "Gap vs opportunity peers"
  Peer_gap_matching: "Gap vs current-setup peers"